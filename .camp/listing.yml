name: Course completed enrolment
summary: Enrol users upon completion of a course.
description: |
  - With this plugin it is possible to create a chain of courses.  The moment a student completes a course, the person is automatically enrolled in one or more courses. But it can also be used to give a user another role after completing the course.
  - Administrators can also enrol users who completed past courses.
  - Administrators can bulk modify and delete users.
  - When a user is part of a group in the first course, the user can also be part of the group with the same name in the second course.
  - When a user can use self unenrolment in the course that has to be completed, the enrolment method will try to unenroll this user when configured.
  - When you want to enrol all users only after a particular date, configure this date as part of the course completion.
  - When you want that this plugin only works for a limited period, configure enrolment start and end date. Before and after this date, this plugin will do nothing.
  - You can also plan to enrol a user in the future (the welcome message will also be sent only the moment the user is enrolled).
  - You can optionally restrict the automatic enrolment to members of selected groups in the completed course. 
labels:
  - fully-free
category: enrol
links:
  docs: https://github.com/ewallah/moodle-enrol_coursecompleted/README.md
  issues: https://github.com/ewallah/moodle-enrol_coursecompleted/issues

